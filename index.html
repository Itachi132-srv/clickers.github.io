<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Tap Arcade</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-neon: #00f2ff;
            --bg-color: #ffeb3b;
            --glass: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-touch-callout: none;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-color);
            transition: background-color 0.8s ease;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .screen {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: opacity 0.3s ease;
        }

        .hidden { display: none !important; opacity: 0; }

        .glass-panel {
            background: var(--glass);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            width: 85%;
            max-width: 400px;

            /* FIX: center alignment */
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-size: 3rem;
            font-weight: 800;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 20px rgba(255,255,255,0.5);
            margin-bottom: 10px;

            /* FIX: ensure proper centering */
            width: 100%;
            text-align: center;
        }

        p { color: rgba(255,255,255,0.8); margin-bottom: 30px; }

        .score-display {
            position: absolute;
            top: 50px;
            font-size: 4rem;
            font-weight: 800;
            color: white;
            text-shadow: 0 0 15px rgba(0,0,0,0.2);
        }

        .tap-prompt {
            font-size: 1.5rem;
            color: white;
            font-weight: 600;
            animation: pulse 1.5s infinite;
        }

        .btn {
            background: #fff;
            color: #000;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 0 20px rgba(255,255,255,0.4);
            margin: 10px;
            text-transform: uppercase;
        }

        .btn:active { transform: scale(0.95); }

        @keyframes pulse {
            0% { opacity: 0.4; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.1); }
            100% { opacity: 0.4; transform: scale(1); }
        }
    </style>
</head>
<body>

    <audio id="sound1" src="sound1.mp3"></audio>
    <audio id="sound2" src="sound2.mp3"></audio>

    <div id="start-menu" class="screen">
        <div class="glass-panel">
            <h1>SHARDAPS</h1>
            <p id="high-score">High Score: 0</p>
            <button class="btn" onclick="startGame()">Play</button>
        </div>
    </div>

    <div id="gameplay" class="screen hidden">
        <div id="score" class="score-display">0</div>
        <div id="tap-fast" class="tap-prompt">TAP FAST</div>
    </div>

    <div id="game-over" class="screen hidden">
        <div class="glass-panel">
            <h1 style="color: #ff4444;">GAME OVER</h1>
            <p>Final Score</p>
            <div id="final-score" style="font-size: 3rem; color: white; margin-bottom: 20px; font-weight: 800;">0</div>
            <button class="btn" onclick="restartGame()">Restart</button>
            <button class="btn" onclick="showMenu()" style="background: transparent; color: white; border: 2px solid white;">Menu</button>
        </div>
    </div>

    <script>
        let score = 0;
        let highScore = localStorage.getItem("highScore") || 0;

        let gameActive = false;
        let timer = null;

        const colors = ['#ffeb3b', '#00f2ff', '#70ff00', '#ff007f', '#9d00ff', '#ff5722'];
        let colorIndex = 0;

        const sfxButton = document.getElementById('sound1');
        const sfxTap = document.getElementById('sound2');

        const gameplayScreen = document.getElementById('gameplay');
        const startMenu = document.getElementById('start-menu');
        const gameOverScreen = document.getElementById('game-over');
        const scoreElement = document.getElementById('score');
        const tapPrompt = document.getElementById('tap-fast');
        const highScoreElement = document.getElementById('high-score');

        highScoreElement.innerText = "High Score: " + highScore;

        function playSound(sound) {
            sound.currentTime = 0;
            sound.play().catch(() => {});
        }

        function startGame() {
            score = 0;
            colorIndex = 0;
            updateScore();
            document.body.style.backgroundColor = colors[0];

            startMenu.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            gameplayScreen.classList.remove('hidden');
            tapPrompt.classList.remove('hidden');

            gameActive = true;
        }

        function handleTap(e) {
            if (!gameActive) return;

            const touchCount = e.targetTouches ? e.targetTouches.length : 1;

            if (score === 0) tapPrompt.classList.add('hidden');

            score += touchCount;
            updateScore();
            checkBackgroundChange();
            resetTimer();
        }

        function updateScore() {
            scoreElement.innerText = score;
        }

        function resetTimer() {
            clearTimeout(timer);
            timer = setTimeout(endGame, 1000);
        }

        function checkBackgroundChange() {
            let newColorIndex = Math.floor(score / 50) % colors.length;
            if (newColorIndex !== colorIndex) {
                colorIndex = newColorIndex;
                document.body.style.backgroundColor = colors[colorIndex];
            }
        }

        function endGame() {
            gameActive = false;

            if (score > highScore) {
                highScore = score;
                localStorage.setItem("highScore", highScore);
                highScoreElement.innerText = "High Score: " + highScore;
            }

            gameplayScreen.classList.add('hidden');
            gameOverScreen.classList.remove('hidden');
            document.getElementById('final-score').innerText = score;
        }

        function restartGame() {
            startGame();
        }

        function showMenu() {
            gameOverScreen.classList.add('hidden');
            startMenu.classList.remove('hidden');
            document.body.style.backgroundColor = colors[0];
        }

        gameplayScreen.addEventListener('touchstart', (e) => {
            e.preventDefault();
            handleTap(e);
        }, { passive: false });

        gameplayScreen.addEventListener('mousedown', (e) => {
            if (!('ontouchstart' in window)) {
                handleTap(e);
            }
        });
    </script>
</body>
</html>
